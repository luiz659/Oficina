spring.application.name=oficina

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/oficinadb
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mensagem de erro no corpo da resposta.
# O slide usa server.error.include-message. No Spring Boot 4 a propriedade
# passou para spring.web.error.include-message; sem ela o JSON não traz o texto.
server.error.include-message=always
spring.web.error.include-message=always
